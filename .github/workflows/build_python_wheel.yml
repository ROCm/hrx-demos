name: Build Python Linux Wheel

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: Default
      release_type:
        type: string
        default: nightly
      run_id:
        type: string
        default: ""
      artifact_set:
        type: string
        default: core
      package_version:
        type: string
        default: 0.1.0

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build_python_wheel:
    name: ${{ inputs.name }}
    runs-on: aws-linux-scale-rocm-prod
    timeout-minutes: 30
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:702a5133851e6d1daf1207d2c9fbb01c2667914a5b6dc5a01faeb3ce66ea6421
    env:
      HRX_OUTPUT_DIR: ${{ github.workspace }}/build/wheel
      HRX_BUILD_PYTHON: /opt/python/cp312-cp312/bin/python3
      HRX_PYTHON: ${{ github.workspace }}/build/wheel/python/bin/python3
      HRX_BAZEL_BIN_DIR: ${{ github.workspace }}/build/wheel/tools/bin
      HRX_RELEASE_TYPE: ${{ inputs.release_type }}
      HRX_RUN_ID: ${{ inputs.run_id }}
      HRX_ARTIFACT_SET: ${{ inputs.artifact_set }}
      HRX_ROCM_ARTIFACT_VARIANT: release
      HRX_ROCM_ROOT: ${{ github.workspace }}/build/wheel/rocm-root
      HRX_DOWNLOAD_CACHE_DIR: ${{ github.workspace }}/build/wheel/downloads
      HRX_DEMOS_PACKAGE_VERSION: ${{ inputs.package_version }}
      PIP_CACHE_DIR: ${{ github.workspace }}/build/wheel/caches/pip
      BAZELISK_HOME: ${{ github.workspace }}/build/wheel/caches/bazelisk
      BAZEL: ${{ github.workspace }}/build/wheel/tools/bin/bazel
      WHEEL_DIST_DIR: ${{ github.workspace }}/build/wheel/dist
      WHEEL_OUTPUT_DIR: ${{ github.workspace }}/build/wheel/wheelhouse
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Adjust git config
        run: git config --global --add safe.directory "$PWD"

      - name: Fetch ROCm toolchain
        run: bash .github/scripts/fetch_rocm_toolchain.sh

      - name: Install Python build requirements
        run: |
          "${HRX_BUILD_PYTHON}" --version
          "${HRX_BUILD_PYTHON}" -m pip install --upgrade \
            build \
            "setuptools>=77" \
            "wheel>=0.45"
          "${HRX_BUILD_PYTHON}" -m build --version

      - name: Install Bazel host tools
        run: |
          mkdir -p "${HRX_BAZEL_BIN_DIR}"
          "${HRX_BUILD_PYTHON}" \
            third_party/hrx-system/build_tools/devtools/install.py \
            --group bazel \
            --bin-dir "${HRX_BAZEL_BIN_DIR}"
          "${HRX_BUILD_PYTHON}" \
            third_party/hrx-system/build_tools/devtools/install.py \
            --group bazel \
            --bin-dir "${HRX_BAZEL_BIN_DIR}" \
            --check

      - name: Check build environment
        run: |
          "${HRX_BUILD_PYTHON}" --version
          "${BAZEL}" --version
          "${CC}" --version
          /usr/local/bin/auditwheel --version
          test -n "${AUDITWHEEL_PLAT:-}"
          test -d "${HRX_ROCM_ROOT}/include"
          test -f "${HRX_ROCM_ROOT}/lib/libhsa-runtime64.so.1"
          echo "AUDITWHEEL_PLAT=${AUDITWHEEL_PLAT}"

      - name: Configure Bazel
        run: |
          "${HRX_BUILD_PYTHON}" build_tools/setup_python.py \
            --rocm="${HRX_ROCM_ROOT}" \
            --bazel="${BAZEL}"

      - name: Build Linux wheel
        run: >-
          "${HRX_BUILD_PYTHON}" -m build --wheel
          --outdir "${WHEEL_DIST_DIR}"

      - name: Inspect Linux wheel
        run: /usr/local/bin/auditwheel show "${WHEEL_DIST_DIR}"/*.whl

      - name: Repair manylinux wheel
        run: |
          /usr/local/bin/auditwheel repair \
            --plat "${AUDITWHEEL_PLAT}" \
            --wheel-dir "${WHEEL_OUTPUT_DIR}" \
            "${WHEEL_DIST_DIR}"/*.whl

      - name: Validate manylinux wheel
        run: |
          shopt -s nullglob
          wheels=("${WHEEL_OUTPUT_DIR}"/*.whl)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected one repaired wheel, found ${#wheels[@]}" >&2
            printf '  %s\n' "${wheels[@]}" >&2
            exit 1
          fi
          if [[ "$(basename "${wheels[0]}")" != *manylinux* ]]; then
            echo "Repaired wheel is not tagged manylinux: ${wheels[0]}" >&2
            exit 1
          fi
          /usr/local/bin/auditwheel show "${wheels[0]}"
          "${HRX_BUILD_PYTHON}" -m pip install \
            --force-reinstall --no-deps "${wheels[0]}"
          hrx-id4 --help >/dev/null
          hrx-info --help >/dev/null

      - name: Upload manylinux wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hrx-demos-wheel-linux-x86_64
          path: build/wheel/wheelhouse/*.whl
          if-no-files-found: error
